# Kickr configuration file (https://github.com/kickr-dev/kickr)
# yaml-language-server: $schema=https://raw.githubusercontent.com/kickr-dev/kickr/beta/.schemas/kickr.v1.schema.json
version: 1
description: Helm library chart for rendering workloads and their related Kubernetes resources from values
gitlab:
  options:
    - kickr
    - overrides:deployment
    - overrides:integration
  release: {}
helm:
  type: library
  path: kickr-dev/workload
  publish: manual
  registry: oci://registry.gitlab.com
license: apache-2.0
maintainers:
  - name: u.kilianpaquier
platform: gitlab
