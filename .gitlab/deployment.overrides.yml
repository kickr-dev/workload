# Add GitLab CI/CD deployment job overrides here.

helm-publish:
  variables:
    HELM_CLI_IMAGE: ghcr.io/jdx/mise:2026.10.7@sha256:66d03744d53f7da73eb3065b166151d48314c652985bdc420881376a4458aa67
  before_script:
    - export PATH="$HOME/.local/share/mise/shims:$PATH"
    # renovate: datasource=github-releases packageName=helm/helm depName=helm
    - mise use -g helm@4.3.0
    # renovate: datasource=github-releases packageName=oras-project/oras depName=oras
    - mise use -g oras@1.3.4
    - !reference [.helm-base, before_script]
  script:
    - helm_publish "$helm_package_file"
    - |
      oras push "${HELM_PUBLISH_URL#oci://}/${helm_package_name}:artifacthub.io"
        --registry-config "$(helm env HELM_REGISTRY_CONFIG)"
        --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml
        artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
