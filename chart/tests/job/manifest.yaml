---
# Source: workload/templates/application.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: workload-job-name-1
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: job-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    team: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 2
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: job-name
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: job-name
          image: kickr-dev/kickr:0.1.0
          args:
            - reindex
            - --shard=$(JOB_COMPLETION_INDEX)
