apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-statefulset-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: statefulset-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: statefulset-name
    matchExpressions:
      - key: service.kubernetes.io/headless
        operator: DoesNotExist
  endpoints:
