---
# Source: workload/templates/application.yaml
apiVersion: v1
kind: Service
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics

---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: worker-name
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: worker-name
          image: kickr-dev/kickr:0.0.0
          env:
            - name: HTTP_METRICS_PORT
              value: "9090"
            - name: HTTP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: http-metrics
              containerPort: 9090
              protocol: TCP

