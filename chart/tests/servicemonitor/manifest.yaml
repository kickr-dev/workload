# Source: workload/templates/application.yaml
apiVersion: v1
kind: Service
metadata:
  name: workload-statefulset-name-headless
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: statefulset-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    service.kubernetes.io/headless: ""
spec:
  selector:
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: statefulset-name
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 9090
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics

