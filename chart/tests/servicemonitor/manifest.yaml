---
# Source: workload/templates/application.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
    matchExpressions:
      - key: service.kubernetes.io/headless
        operator: DoesNotExist
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
