---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  minReadySeconds: 10
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: worker-name
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: worker-name
          image: kickr-dev/kickr:0.1.0
