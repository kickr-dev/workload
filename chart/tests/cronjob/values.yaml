# Code generated by AI (Claude Opus 5.5)

crons:
  # daily business report, retried a few times and skipped when the cluster was down for too long
  report:
    schedule: "0 6 * * *"
    timeZone: Europe/Paris
    suspend: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 300
    completionMode: NonIndexed
    completions: 1
    parallelism: 1
    backoffLimit: 2
    activeDeadlineSeconds: 3600
    failedJobsHistoryLimit: 1
    successfulJobsHistoryLimit: 3
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    labels:
      team: platform
    restartPolicy: OnFailure
    image:
      repository: example/app
    args: [report]

  # frequent purge, not retried since the next run catches up, and its jobs removed once done
  purge:
    schedule: "*/15 * * * *"
    concurrencyPolicy: Forbid
    backoffLimit: 0
    ttlSecondsAfterFinished: 600
    restartPolicy: Never
    image:
      repository: example/app
    args: [purge, --older-than=720h]
