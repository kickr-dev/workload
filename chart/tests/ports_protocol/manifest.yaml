---
# Source: workload/templates/application.yaml
apiVersion: v1
kind: Service
metadata:
  name: workload-api
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: api
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http

---
# Source: workload/templates/application.yaml
apiVersion: v1
kind: Service
metadata:
  name: workload-syslog
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: syslog
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  selector:
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: syslog
  type: LoadBalancer
  ports:
    - port: 9090
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
    - port: 514
      targetPort: syslog
      protocol: UDP
      name: syslog

---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-api
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: api
          image: kickr-dev/kickr:0.1.0
          env:
            - name: HTTP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-syslog
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: syslog
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: syslog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: syslog
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: syslog
          image: kickr-dev/kickr:0.1.0
          env:
            - name: HTTP_METRICS_PORT
              value: "9090"
            - name: SYSLOG_PORT
              value: "5514"
          ports:
            - name: http-metrics
              containerPort: 9090
              protocol: TCP
            - name: syslog
              containerPort: 5514
              protocol: UDP

---
# Source: workload/templates/application.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workload-api
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: gateway
  rules:
    - backendRefs:
        - name: workload-api
          port: 80
