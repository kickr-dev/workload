# Code generated by AI (Claude Opus 5.5)

workers:
  worker-name:
    kind: Deployment
    restartPolicy: Always
    image:
      repository: kickr-dev/kickr
    env:
      BINARY_NAME: worker-name
      LOG_JSON: true
    envFrom:
      - configMapRef:
          name: shared-config
      - prefix: SECRET_
        secretRef:
          name: shared-secret
    ports:
      http: 3000
      http-metrics: 9090
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /ready
        port: http
    # slow first start (e.g. cache warm-up) without loosening the liveness probe
    startupProbe:
      httpGet:
        path: /ping
        port: http
      failureThreshold: 30
    podAnnotations:
      kubectl.kubernetes.io/default-container: '{{ .Component.Name }}'
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: Always
      runAsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      privileged: false
      readOnlyRootFilesystem: true
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: workers
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: worker-name
