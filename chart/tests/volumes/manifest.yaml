---
# Source: workload/templates/application.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workload-worker-name-data
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi

---
# Source: workload/templates/application.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workload-worker-name-cache
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi

---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: worker-name
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: worker-name
          image: example/app:0.0.0
          volumeMounts:
            - name: data
              mountPath: /var/lib/data/
            - name: cache
              mountPath: /var/cache/
            - mountPath: /etc/config/
              name: config
              readOnly: true
            - mountPath: /tmp/
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workload-worker-name-data
        - name: cache
          persistentVolumeClaim:
            claimName: workload-worker-name-cache
        - configMap:
            name: 'workload-config'
          name: config
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
