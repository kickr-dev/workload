---
# Source: workload/templates/application.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workload-cron-name
  labels:
    helm.sh/chart: workload-0.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: cron-name
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: workload
            app.kubernetes.io/instance: workload
            app.kubernetes.io/component: cron-name
        spec:
          serviceAccountName: custom-service-account-name
          restartPolicy: OnFailure
          containers:
            - name: cron-name
              image: example/app:0.0.0
