# Code generated by AI (Claude Opus 5.5)

jobs:
  # database migration before the workers roll out, with its resources hooked one weight before it
  job-name:
    hook:
      events: [pre-install, pre-upgrade]
      weight: 5
      deletePolicies: [before-hook-creation, hook-succeeded]
    annotations:
      team: platform
    restartPolicy: OnFailure
    image:
      repository: example/app
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/migrate
      rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
    configMaps:
      - name: config
        data:
          LOG_LEVEL: info
    secrets:
      - name: credentials
        data:
          DATABASE_USER: migrate
    externalSecrets:
      - name: env
        secretStoreRef:
          kind: SecretStore
          name: vault
        dataFrom:
          - extract:
              key: database
