apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
  template:
    metadata:
      annotations:
        checksum/secrets: 28896fc7d5b448fce121a477907450784cec24ace25f27a1a0b84289ec4d1ff1
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: worker-name
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: worker-name
          image: kickr-dev/kickr:0.1.0
          envFrom:
            - prefix: APP_
              secretRef:
                name: 'workload-worker-name-credentials'
            - secretRef:
                name: external-secret
                optional: true
          volumeMounts:
            - name: secret-files
              mountPath: /etc/secrets/
              readOnly: true
      volumes:
        - name: secret-files
          secret:
            secretName: workload-worker-name-files

