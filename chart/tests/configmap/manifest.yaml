---
# Source: workload/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-worker-name
  labels:
    helm.sh/chart: workload-0.1.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: workload
    app.kubernetes.io/component: worker-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: workload
      app.kubernetes.io/component: worker-name
  template:
    metadata:
      annotations:
        checksum/configmaps: fdce7e0cdefa4114e824f2bf1fb41474fe7702a5a752894349631f33000e2bfe
        checksum/custom: 'db26993a5207d84a5c8ba5d10534d8c1a0b8cd892e8ce1b7dfc37a9452d1a51e'
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: worker-name
    spec:
      serviceAccountName: default
      restartPolicy: Always
      containers:
        - name: worker-name
          image: kickr-dev/kickr:0.1.0
          volumeMounts:
            - name: configmap-extra
              mountPath: /etc/extra/
              readOnly: true
            - name: configmap-config
              mountPath: /etc/config/
              readOnly: true
            - mountPath: /etc/custom/
              name: custom
              readOnly: true
      volumes:
        - name: configmap-extra
          configMap:
            name: workload-worker-name-extra
        - name: configmap-config
          configMap:
            name: workload-worker-name-config
        - configMap:
            name: 'workload-custom'
          name: custom

