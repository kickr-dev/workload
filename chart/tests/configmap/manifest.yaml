spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: workload
        app.kubernetes.io/component: job-name
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: job-name
          image: kickr-dev/kickr:0.1.0
          volumeMounts:
            - name: configmap-config
              mountPath: /etc/config/
              readOnly: true
      volumes:
        - name: configmap-config
          configMap:
            name: workload-job-name-config
