apiVersion: v2
name: workload
# BEGIN_KICKR_DESCRIPTION
description: Helm library chart for rendering workloads and their related Kubernetes resources from values
# END_KICKR_DESCRIPTION

# Chart type, either 'application' or 'library'.
#   - An application chart is packaged into a versioned archive and deployed.
#   - A library chart only shares helpers with the application charts depending on it, so it can't be deployed.
type: library

# Chart version, following Semantic Versioning (https://semver.org/).
# Bump it on any change to the chart, its templates or its app version.
#
# When using kickr generated CI/CD, leave the placeholder as is since it's set to the release version when packaging.
version: 0.0.0

# BEGIN_KICKR_MAINTAINERS
maintainers:
  - name: u.kilianpaquier
# END_KICKR_MAINTAINERS

annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: changelog
      url: https://gitlab.com/kickr-dev/workload/-/blob/main/CHANGELOG.md
    - name: support
      url: https://gitlab.com/kickr-dev/workload/-/work_items
home: https://gitlab.com/kickr-dev/workload
keywords:
  - cronjob
  - daemonset
  - deployment
  - job
  - library
  - statefulset
  - workload
kubeVersion: ">=1.23.0-0"
sources:
  - https://gitlab.com/kickr-dev/workload
