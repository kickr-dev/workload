{{- define "workload.daemonset" -}}
{{- $config := .Component.Values -}}
{{- $componentName := include "workload.componentName" . -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $componentName }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
    {{- with $config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $config.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "workload.selectorLabels" . | nindent 6 }}
  {{- with $config.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  {{- if hasKey $config "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ $config.revisionHistoryLimit }}
  {{- end }}
  template:
    {{- include "workload.pod" . | nindent 4 }}
{{ end }}
