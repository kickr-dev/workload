{{- define "workload.verticalpodautoscaler" -}}
{{- $config := .Component.Values -}}
{{- $componentName := include "workload.componentName" . -}}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $componentName }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: {{ $config.kind }}
    name: {{ $componentName }}
  {{- with $config.vpa.updateMode }}
  updatePolicy:
    updateMode: {{ . | quote }}
  {{- end }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Component.Name }}
        {{- with $config.vpa.controlledResources }}
        controlledResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $config.vpa.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $config.vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{ end }}
