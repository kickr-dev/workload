{{/* Code generated by AI (Claude Opus 5.5) */}}

{{/*
Application renders all resources of the given root context: its service account, workers, jobs and crons.
*/}}
{{- define "workload.application" -}}

{{- $serviceAccount := .Values.serviceAccount | default dict }}
{{- if $serviceAccount.create }}{{ include "workload.serviceaccount" . }}{{- end }}

{{- if $serviceAccount.rules }}
{{- include "workload.role" . }}
{{- include "workload.rolebinding" . }}
{{- end }}

{{- range $group := list "crons" "jobs" "workers" }}
{{- range $name, $config := index $.Values $group }}

{{- $workload := merge (dict "Component" (dict "Name" $name "Values" $config)) $ }}

{{- with $config.serviceAccount }}
{{- if .create }}{{ include "workload.serviceaccount" $workload }}{{- end }}
{{- if .rules }}
{{- include "workload.role" $workload }}
{{- include "workload.rolebinding" $workload }}
{{- end }}
{{- end }}

{{- include "workload.configmaps" $workload }}
{{- include "workload.secrets" $workload }}
{{- include "workload.externalsecrets" $workload }}
{{- include "workload.persistentvolumeclaims" $workload }}

{{- if eq $group "crons" }}{{ include "workload.cronjob" $workload }}{{- end }}
{{- if eq $group "jobs" }}{{ include "workload.job" $workload }}{{- end }}

{{- if eq $group "workers" }}
{{- include (print "workload." (lower $config.kind)) $workload }}
{{- include "workload.service" $workload }}

{{- if and $config.autoscaling $config.autoscaling.enabled }}{{ include "workload.horizontalpodautoscaler" $workload }}{{- end }}
{{- if and $config.httpRoute $config.httpRoute.enabled }}{{ include "workload.httproute" $workload }}{{- end }}
{{- if and $config.ingressRoute $config.ingressRoute.enabled }}{{ include "workload.ingressroute" $workload }}{{- end }}
{{- if and $config.pdb $config.pdb.enabled }}{{ include "workload.poddisruptionbudget" $workload }}{{- end }}
{{- if and $config.keda $config.keda.enabled }}{{ include "workload.scaledobject" $workload }}{{- end }}
{{- if and $config.podMonitor $config.podMonitor.enabled }}{{ include "workload.podmonitor" $workload }}{{- end }}
{{- if and $config.serviceMonitor $config.serviceMonitor.enabled }}{{ include "workload.servicemonitor" $workload }}{{- end }}
{{- if and $config.vpa $config.vpa.enabled }}{{ include "workload.verticalpodautoscaler" $workload }}{{- end }}

{{- end }}
{{- end }}
{{- end }}
{{- end }}
