{{- define "workload.externalsecrets" -}}
{{- $componentName := include "workload.componentName" . -}}
{{- range .Component.Values.externalSecrets -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ print $componentName "-" .name }}
  labels:
    {{- include "workload.labels" $ | nindent 4 }}
  {{- if $.Component.Values.hook }}
  annotations:
    {{- include "workload.hookAnnotations" (dict "hook" $.Component.Values.hook "offset" -1) | nindent 4 }}
  {{- end }}
spec:
  {{- with .refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  secretStoreRef:
    {{- toYaml .secretStoreRef | nindent 4 }}
  target:
    name: {{ print $componentName "-" .name }}
    creationPolicy: Owner
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{ end }}
{{- end }}
