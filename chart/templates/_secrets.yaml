{{- define "workload.secrets" -}}
{{- $config := .Component.Values }}
{{- $componentName := include "workload.componentName" . }}

{{- $names := list -}}
{{- range concat ($config.secrets | default list) ($config.externalSecrets | default list) }}
{{- if has .name $names }}{{ fail (printf "secrets and externalSecrets name %q is duplicated" .name) }}{{ end }}
{{- $names = append $names .name }}
{{- end }}

{{- range $secret := $config.secrets -}}
{{- $keys := list -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ print $componentName "-" .name }}
  labels:
    {{- include "workload.labels" $ | nindent 4 }}
  {{- if $config.hook }}
  annotations:
    {{- include "workload.hookAnnotations" (dict "hook" $config.hook "offset" -1) | nindent 4 }}
  {{- end }}
type: Opaque
data:
{{- range .templates }}
  {{- range $path, $_ := $.Files.Glob . }}
  {{- if has (base $path) $keys }}{{ fail (printf "secrets %q key %q is duplicated" $secret.name (base $path)) }}{{ end }}
  {{- $keys = append $keys (base $path) }}
  {{ base $path }}: {{ tpl ($.Files.Get $path) $ | trimSuffix "\n" | b64enc }}
  {{- end }}
{{- end }}

{{- range .files }}
  {{- range $path, $_ := $.Files.Glob . }}
  {{- if has (base $path) $keys }}{{ fail (printf "secrets %q key %q is duplicated" $secret.name (base $path)) }}{{ end }}
  {{- $keys = append $keys (base $path) }}
  {{ base $path }}: {{ $.Files.Get $path | trimSuffix "\n" | b64enc }}
  {{- end }}
{{- end }}

{{- range $key, $value := .data }}
  {{- if has $key $keys }}{{ fail (printf "secrets %q key %q is duplicated" $secret.name $key) }}{{ end }}
  {{ $key }}: {{ tpl (toString $value) $ | b64enc }}
{{- end }}
{{ end }}
{{- end }}
