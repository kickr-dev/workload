{{- define "workload.httproute" -}}
{{- $config := .Component.Values -}}
{{- $componentName := include "workload.componentName" . -}}

{{- $port := index (include "workload.ports" . | fromYaml) $config.httpRoute.port -}}
{{- if not $port }}{{ fail (printf "httpRoute.port %q isn't in ports" $config.httpRoute.port) }}{{ end -}}
{{- if ne $port.protocol "TCP" }}{{ fail (printf "httpRoute.port %q isn't TCP" $config.httpRoute.port) }}{{ end -}}

{{- $backendRefs := list (dict "name" $componentName "port" $port.servicePort) -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $componentName }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
  {{- with $config.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $config.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $config.httpRoute.rules }}
    - {{ merge (dict "backendRefs" $backendRefs) . | toYaml | nindent 6 | trim }}
    {{- else }}
    - backendRefs:
        {{- toYaml $backendRefs | nindent 8 }}
    {{- end }}
{{ end }}
